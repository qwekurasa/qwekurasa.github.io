name: Publish portfolio

on:
  push:
    branches: [main]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the portfolio frontend
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare the public site
        shell: bash
        run: |
          git clone --depth 1 --branch main --single-branch https://github.com/qwekurasa/portfolio.git source
          mkdir public
          cp -R site/. public/
          cp source/projects.js public/
          cp -R source/img public/
          git -C source rev-parse HEAD > public/source-revision.txt
      - name: Upload public files
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the portfolio
        id: deployment
        uses: actions/deploy-pages@v4
